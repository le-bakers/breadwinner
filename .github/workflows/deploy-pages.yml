name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare Pages artifact
        shell: bash
        run: |
          mkdir -p _site
          cp -R frontend/. _site/
          cp frontend/index/index.html _site/index.html
          cp frontend/index/index.js _site/index.js
          cp frontend/index/index.css _site/index.css
          sed -i 's#\.\./##g' _site/index.html _site/index.js
          # The error page is served at the missing URL, including nested paths.
          # Anchor its assets and home link to the GitHub Pages project root.
          if [[ "${GITHUB_REPOSITORY#*/}" == *.github.io ]]; then
            pages_base="/"
          else
            pages_base="/${GITHUB_REPOSITORY#*/}/"
          fi
          sed -i "s#<base href=\"/\">#<base href=\"${pages_base}\">#" _site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
