<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us | BreadWinner</title>
<meta name="description" content="Get in touch with the BreadWinner team with questions, feedback, or product support requests.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared.css">
<link rel="stylesheet" href="../contactus/contactus.css">
<link rel="icon" type="image/x-icon" href="../images/breadwinner_icon.png">
</head>
<body>

<a class="sr-only" href="#main-content">Skip to main content</a>

<div data-navbar="other"></div>

<main id="main-content">
	<section class="contact-hero">
		<div class="container contact-hero-inner">
			<div>
				<p class="eyebrow">We are here to help</p>
				<h1>What can we do for you?</h1>
				<p class="contact-lead">Have a question about receipt tracking, found a better way to do things, or <em>gasp</em>, discovered a bug?! Let us know by emailing us at <b>support.breadwinner@gmail.com</b></p>
			</div>
			<div class="contact-hero-mark" aria-hidden="true">
				<svg viewBox="0 0 180 180" fill="none">
					<circle cx="90" cy="90" r="76" fill="var(--accent-light)"/>
					<path d="M48 66.5C48 58.5 54.5 52 62.5 52h55c8 0 14.5 6.5 14.5 14.5v35c0 8-6.5 14.5-14.5 14.5H91l-20 16v-16h-8.5c-8 0-14.5-6.5-14.5-14.5v-35Z" fill="var(--primary)"/>
					<path d="M68 82h44M68 98h29" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
				</svg>
			</div>
		</div>
	</section>

	
</main>

<div data-footer></div>

<script src="../components/navbar.js" type="module"></script>
<script src="../components/footer.js" type="module"></script>
<script src="../shared.js" type="module"></script>
<script src="../contactus/contactus.js" type="module"></script>
</body>
</html>
